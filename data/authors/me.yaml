bio: |
  I am an Associate Research Professor at the International Centre for Numerical
  Methods in Engineering (CIMNE), Barcelona, Spain. My research focuses on
  computational mechanics, computational fluid dynamics and scientific computing,
  with an emphasis on numerical methods for high-fidelity simulation of complex flows.

  A central thread of my work is multiscale modelling: connecting the evolution of
  large-scale flows to the fine-scale physics that shapes their behaviour. I have
  contributed to the development of Pseudo-Direct Numerical Simulation (P-DNS),
  including formulations for turbulent boundary layers and particle-laden flows.
  These methods aim to make detailed flow simulation computationally affordable
  while retaining the influence of small-scale interactions.

  My broader work encompasses particle-based numerical methods, multiphase flows,
  external aerodynamics and data-driven flow modelling. I develop and implement
  computational tools that connect numerical research with applications in energy,
  infrastructure and industrial processes, alongside supervising doctoral research
  and leading collaborative projects.

  Building on this trajectory, I am developing a research direction in quantum
  computational mechanics, particularly quantum spectral methods for incompressible
  flow and quantum–classical multiscale simulation. This work explores how quantum
  algorithms can complement established computational approaches to fluid mechanics.

