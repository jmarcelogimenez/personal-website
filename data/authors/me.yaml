bio: |
  I am an Associate Research Professor at the International
  Centre for Numerical Methods in Engineering (CIMNE),
  Barcelona, Spain.

  My research focuses on computational mechanics,
  computational fluid dynamics and scientific computing,
  with an emphasis on developing numerical methods for
  high-fidelity simulation of complex fluid flows.

  A central direction of my work is multiscale modelling,
  particularly Pseudo-Direct Numerical Simulation (P-DNS),
  which couples coarse-scale flow evolution with
  representative fine-scale problems.

  My research also encompasses particle-based numerical
  methods, multiphase flows and data-driven modelling.
  More recently, I have initiated a research direction
  in quantum computational mechanics, developing quantum
  spectral formulations for incompressible flow and
  exploring quantum-classical multiscale simulation.

